# Lance les commandes ytclips sur une machine GitHub, à la demande (onglet Actions → « yt-clips » → Run workflow).
# Aucun envoi public n'est possible depuis ce workflow : il n'appelle jamais « publish --public ».
# Les sept secrets se règlent dans Settings → Secrets and variables → Actions ; ils ne sont jamais affichés.
name: yt-clips

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Commande à lancer"
        type: choice
        required: true
        default: check
        options:
          - check
          - transcribe
          - montage-plan
          - montage-list
          - montage-send
          - tiktok-list
          - history
      source:
        description: "Vidéo du bucket, ex. sources/mon_film.mp4 (transcribe, montage-plan)"
        type: string
      title:
        description: "Titre de l'œuvre, pour le titre du montage (montage-plan)"
        type: string
      segments:
        description: "Passages imposés : « début-fin, début-fin, … », 4 à 6, 60 s au total (montage-plan)"
        type: string
      zoom:
        description: "Cadrage : 1.0 image entière, jusqu'à 2.0 recadrage centré (montage-plan)"
        type: string
        default: "1.0"
      language:
        description: "Langue parlée, ex. fr ou ja ; vide = détection (transcribe)"
        type: string
      montage_id:
        description: "Début de l'identifiant du plan ; vide s'il n'y en a qu'un (montage-send)"
        type: string
      dry_run:
        description: "Simulation : rien n'est écrit ni envoyé (montage-plan, montage-send)"
        type: boolean
        default: true
      rights_confirmed:
        description: "Je confirme être autorisé à utiliser et à republier cette vidéo (montage-send)"
        type: boolean
        default: false

permissions:
  contents: read

# Une seule exécution à la fois : l'historique anti-doublons de R2 reste la référence, ceci évite le travail en double.
concurrency:
  group: yt-clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: yt-clips
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YTCLIPS_S3_BUCKET: ${{ secrets.YTCLIPS_S3_BUCKET }}
      YTCLIPS_S3_ACCESS_KEY_ID: ${{ secrets.YTCLIPS_S3_ACCESS_KEY_ID }}
      YTCLIPS_S3_SECRET_ACCESS_KEY: ${{ secrets.YTCLIPS_S3_SECRET_ACCESS_KEY }}
      YTCLIPS_S3_ENDPOINT_URL: ${{ secrets.YTCLIPS_S3_ENDPOINT_URL }}
      # Les saisies passent par l'environnement, jamais par le texte du script.
      IN_ACTION: ${{ inputs.action }}
      IN_SOURCE: ${{ inputs.source }}
      IN_TITLE: ${{ inputs.title }}
      IN_SEGMENTS: ${{ inputs.segments }}
      IN_ZOOM: ${{ inputs.zoom }}
      IN_LANGUAGE: ${{ inputs.language }}
      IN_MONTAGE_ID: ${{ inputs.montage_id }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
      IN_RIGHTS: ${{ inputs.rights_confirmed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: FFmpeg et polices
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Modèle de transcription (réutilisé d'une exécution à l'autre)
        if: inputs.action == 'transcribe'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Dépendances
        run: |
          if [ "$IN_ACTION" = "transcribe" ]; then
            uv sync --frozen --extra dev --extra transcribe
          else
            uv sync --frozen --extra dev
          fi

      - name: Présence des secrets (valeurs jamais affichées)
        run: |
          missing=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN \
                      YTCLIPS_S3_BUCKET YTCLIPS_S3_ACCESS_KEY_ID YTCLIPS_S3_SECRET_ACCESS_KEY YTCLIPS_S3_ENDPOINT_URL; do
            if [ -n "${!name}" ]; then echo "$name : présent"; else echo "$name : ABSENT"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Secrets manquants : Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: ytclips
        run: bash scripts/ci_run.sh
